[project]
name = "forecast"
version = "0.1.0"
description = "พยากรณ์หุ้น KBANK และ ADVANC — โมเดลสองขั้น / CNN / เวลา–ความถี่"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cnn = ["torch>=2.0"]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
