# กติกากลาง (หัวข้อ 01–02, 05, 11 ในแผน) — ทุกสคริปต์อ่านจากไฟล์นี้ไฟล์เดียว
# ค่าที่มีหมายเหตุ "ต้องยืนยัน" ต้องคุยกับอาจารย์ / วัดความหน่วงก่อนล็อกวิธี (5 พ.ย.)

timezone: Asia/Bangkok
symbols: [KBANK, ADVANC]

# ข้อมูลดิบ: data/raw/<source>/<SYMBOL>_<interval>.csv
# Settrade 1m ย้อนได้แค่ ~4 วันทำการ → backtest ใช้ yfinance 60m (~3 ปี ตั้งแต่ 24/10/2023, 730 วันทำการ, ขาด 02/01/2024 และ 02/02/2026) ซึ่งตรวจแล้วว่าราคา label ตรงกับ Settrade
data:
  source: yfinance           # โฟลเดอร์ใต้ data/raw/
  interval: 60m              # ความละเอียดของไฟล์หลัก (labels + features)
  # P(10:00) ของไฟล์หยาบ = open รายวัน (= ราคาประมูลเปิด) — open แท่ง 60m ของ yfinance คือราคา ณ 10:00 ซึ่งต่างได้ 1 tick
  # ไม่ใช้ yfinance 1d: ปี 2024 มี ~60 วันที่ราคาแบนและ volume 0 (ไม่ตรง Settrade) ทั้งที่แท่ง 60m วันเดียวกันปกติ
  daily_open_sources: [settrade]   # data/raw/settrade/<SYMBOL>_1d.csv (~3 ปี)
bar_timestamp: start         # ยืนยันจากข้อมูลจริงแล้ว ทั้ง Settrade และ yfinance (แท่งสุดท้ายเช้า 12:29 / 60m 12:00)

sessions:
  morning:
    submit_deadline: "09:30"   # ยืนยันแล้ว
    cutoff: "09:15"            # c_เช้า — ชั่วคราว รอผลวัดความหน่วง
    start_time: "10:00"        # P(10:00)
    end_time: "12:30"          # P(12:30)
  afternoon:
    submit_deadline: "12:30"   # ยืนยันแล้ว
    cutoff: "12:15"            # c_บ่าย — ชั่วคราว รอผลวัดความหน่วง (สำคัญ: กำหนดว่าใช้ข้อมูลเช้าถึงนาทีไหน)
    start_time: "14:00"        # P(14:00)
    end_time: "16:30"          # P(16:30)

# ภาคบ่ายเปิด 14:00 ตั้งแต่ 25 มี.ค. 2024 (ก่อนหน้านั้น 14:30) — ใช้ข้อมูลบ่ายหลังวันนี้เท่านั้น
afternoon_history_start: "2024-03-25"

label:
  # ราคา 16:30 — ชั่วคราว รอยืนยันกับอาจารย์
  #   last_trade_at_or_before = ราคาซื้อขายล่าสุด ณ/ก่อน 16:30 (สิ้นสุด continuous)
  #   closing_auction         = ราคาปิดประมูล (ATC, แท่งหลัง 16:30)
  price_1630: last_trade_at_or_before
  #   closing_auction ใช้ราคาปิดทางการของวันนั้นจาก Settrade 1d (ไฟล์ 60m ไม่มีแท่งประมูลปิด) → cache แยก (_atc)
  #   โมเดลสำรองของนิยามนี้: outputs/models/R4ATC/ (ใช้เฉพาะเมื่ออาจารย์ตอบว่า 16:30 = ATC)
  store_closing_auction: true    # เก็บราคาปิดประมูลเป็นคอลัมน์ p_close_auction ไว้สลับได้โดยไม่ต้องดึงข้อมูลใหม่
  # P(c) รอบเช้าของ label z / features fl_* / โมเดลราคา (NEXT_STEPS รอบที่ 4 ข้อ 4)
  #   last_bar_close = ราคาปิดแท่ง 60m ล่าสุด (เดิม) | official_close = ราคาปิดทางการรวม ATC ของวันทำการก่อน (= วันจริง)
  p_ref_morning: official_close   # T4 ผ่าน (results/round4/t4_price_official_pref.csv) → ใช้ตั้งแต่ 1 พ.ย.
  flat:
    definition: exact_equal      # ชั่วคราว: ปลายช่วง = ต้นช่วงพอดี (ต่าง 0 tick) | within_ticks (ใช้คู่กับ ticks)
    ticks: 0                     # ใช้เมื่อ definition = within_ticks
    label_states: 3              # ขึ้น / เท่าเดิม / ลง
    scoring: [flat_as_wrong, flat_excluded]   # รอยืนยันกับอาจารย์ — รายงานทั้งสองแบบไปก่อน
  # P(10:00) / P(14:00) = open ของแท่งแรกของภาค (แท่งประมูลเปิด); P(12:30) / P(16:30) = close แท่งล่าสุด ≤ 12:29 / 16:29
  start_price_tolerance_min: 5   # แท่งแรกของภาคต้องเริ่มไม่เกินเวลาเริ่มช่วง + กี่นาที ไม่งั้นถือว่าข้อมูลหาย
  max_end_staleness_min: 15      # ราคาปลายช่วงต้องไม่เก่ากว่านี้ ไม่งั้นนับเป็นข้อมูลหาย

features:
  # ไม่ใช้ volume สะสมภายในวัน: volume ช่วงเช้าของ yfinance เสีย (แท่ง 10:00 มักเป็น 0) ทำให้ค่าจาก backtest
  # ต่างจากวันจริงที่คำนวณจาก 1m (01b_validate_sources.py: ต่างสูงสุด ~2.8 ส่วน features ราคาเท่ากันทุกค่า)
  exclude: [vol_ratio_same_time]   # ตัดทั้งของหุ้นตัวเองและของหุ้นอีกตัว (f_x_<SYM>_...)

quantiles: [0.10, 0.25, 0.50, 0.75, 0.90]

evaluation:
  test_block_days: 5       # เลื่อนช่วงทดสอบทีละสัปดาห์
  min_train_days: 120
  holdout_days: 10         # กันช่วงท้ายไว้ใช้หลังล็อกวิธีเท่านั้น
  n_boot: 2000
  block_days: 1            # ขนาดบล็อกวันของ block bootstrap

live:
  # โมเดลที่ล็อก (NEXT_STEPS รอบที่ 3 ข้อ 3 → results/lock_decision.md) — bundle ที่ outputs/models/<E>/<variant>/
  direction: E12/fd_lr       # ทิศทาง: E12 F0 + F-daily, LR (แทน E9-LRx ตามเกณฑ์ข้อ 3) · ทางสุดท้าย = E0-ud จากประวัติ
  price_eq: E9FLAT/aprice_lr # P(ราคาปลาย = P(c))
  price_up: E9FLAT/pprice_lr # P(ราคาปลาย > P(c) | ไม่เท่า) → กฎค่ามัธยฐาน
  shadow: E9/baseline_ud     # รันเงา E0-ud + ช่วงราคา quantile ของ z
  flat_dir: E9FLAT/adir_lr   # P(นิ่ง) สำหรับกฎ 3 คำตอบ (ใช้เฉพาะเมื่อ three_way.enabled)
  # ข้อ 1ข: ส่ง "เท่าเดิม" ได้ → argmax ของ (1 − f)·p, f, (1 − f)·(1 − p) — เปิดเฉพาะเมื่ออาจารย์อนุญาตและ T1 ผ่าน
  three_way: {enabled: false}
  # E13 ชั้น 2 รอบบ่าย (results/e13_preregistration.md): shadow = ส่ง p₁ บันทึก p_final · live = ส่ง p_final
  #   live ใช้เฉพาะเมื่อผ่านเกณฑ์ E-4 ทุกข้อ (หรือข้อยกเว้นตามคำตอบอาจารย์) · ฝึกตอนเย็นวันก่อน → outputs/models/stage2/<วันที่>.json
  stage2: {enabled: true, mode: shadow, train_days: 20, l2: 45, min_nonflat: 20}
  model_dir: ""              # "" = outputs/models/<spec> · "R4ATC" = ชุดที่ฝึกด้วย label 16:30 = ATC (ใช้คู่ label.price_1630)
  max_price_age_min: 30    # สำหรับรอบบ่าย: ราคา P(c) ต้องไม่เก่ากว่านี้
  # แท่ง 1m ของ "วันนี้" ในวันจริง: ลองตามลำดับ แล้วรวมเป็น data.interval ด้วย aggregate_bars (แบบ yfinance)
  # Settrade = แหล่งหลัก (บัญชีมีสิทธิ์ market data แล้ว) · yfinance = สำรองเท่านั้น (ช้าได้ 15–20 นาที
  # ซึ่งเกิน max_bar_lag_min → ถ้า Settrade ล้ม รอบบ่ายมักไม่มีข้อมูลวันนี้)
  sources: [settrade, yfinance]
  max_bar_lag_min: 5       # แท่งล่าสุดของแหล่งต้องจบไม่เกินกี่นาทีก่อนจุดตัด ไม่งั้นลองแหล่งถัดไป
  # ราคาจุดต้องสอดคล้องกับทิศทาง (ข้อ 1ง — เปิดเฉพาะเมื่ออาจารย์กำหนด):
  #   P(ขึ้น) > 0.5 + margin → P(c) + 1 ช่อง · P(ขึ้น) < 0.5 − margin → P(c) − 1 ช่อง
  #   นอกนั้นใช้กฎค่ามัธยฐาน แต่ถ้ากฎเลื่อนสวนทิศทาง → P(c)
  price_consistency: {enabled: false, margin: 0.05}
  # ข้อ B รอบที่ 5 — อาจารย์ให้ส่งทศนิยมได้: ราคา = P(c)·exp(P(สูงกว่า)·E[z|สูงกว่า] + P(ต่ำกว่า)·E[z|ต่ำกว่า])
  #   (E[z|·] จากประวัติก่อนวันที่ทาย แยกหุ้น/รอบ) ไม่ปัดช่อง · ราคาปัดช่องจากกฎค่ามัธยฐานอยู่ใน log (point_rule)
  #   ใช้แทน price_consistency (ถ้าเปิดทั้งคู่ ใช้อันนี้)
  price_decimal: {enabled: false}
  # ข้อมูลรายวันของวันทำการก่อนยังไม่มา (ข้อ 3): ดึงซ้ำ → สร้างจากแหล่งสำรอง → ส่งด้วยข้อมูลล่าสุดที่มี
  daily_check:
    refetch_attempts: 2      # ขั้น 2: ดึงซ้ำกี่ครั้ง
    refetch_wait_sec: 20
    final_margin_min: 5      # ขั้น 4: ถ้ายังไม่มี ส่งเมื่อเหลือเวลาก่อนเส้นตายเท่านี้ (วนดึงซ้ำจนถึงตอนนั้น)

# ไฟล์ส่ง (ข้อ 1จ) — เปลี่ยนตามรูปแบบที่อาจารย์กำหนดได้ที่นี่ที่เดียว
submission:
  dir: outputs/predictions
  filename: "{date}_{session}.csv"   # {date} = YYYY-MM-DD, {session} = morning / afternoon, {session_th} = เช้า / บ่าย
  # คอลัมน์ที่ส่ง (ชื่อในไฟล์: ชื่อภายใน) — ชื่อภายในดู COLUMNS ใน scripts/05_predict_live.py
  columns:
    วันที่: date
    รอบ: session_th
    หุ้น: symbol
    ทิศทาง: direction
    P(ขึ้น): p_up
    ราคาคาด: q50
    ช่วง 50%: band50
    ช่วง 80%: band80
  # คอลัมน์ตรวจสอบ (ไม่ส่ง) → ไฟล์ <ชื่อไฟล์>_detail.csv ข้างกัน
  detail: true
